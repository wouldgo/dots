# --- Idle and lock ------------------------------------------------------------
# Colors and look of the lock screen: ~/.config/swaylock/config
#   10 min idle   -> lock
#   15 min idle   -> screens off (back on at the first input)
#   before sleep  -> lock, so the screen is never shown unlocked on resume

set $lock swaylock -f

exec swayidle -w \
    timeout 600 '$lock' \
    timeout 900 'swaymsg "output * power off"' \
        resume 'swaymsg "output * power on"' \
    before-sleep '$lock'

bindsym $mod+Escape exec $lock

# No idle while a window is fullscreen (videos, presentations)
for_window [all] inhibit_idle fullscreen
