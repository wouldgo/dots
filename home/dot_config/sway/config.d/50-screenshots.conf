# --- Screenshots --------------------------------------------------------------
#   Print        -> select a region, copy it to the clipboard
#   Shift+Print  -> whole screen, saved to ~/Pictures/Screenshots

bindsym Print exec grim -g "$(slurp)" - | wl-copy --type image/png
bindsym Shift+Print exec mkdir -p ~/Pictures/Screenshots && \
    grim ~/Pictures/Screenshots/$(date +%Y-%m-%d_%H-%M-%S).png && \
    notify-send "Screenshot saved" "~/Pictures/Screenshots"
