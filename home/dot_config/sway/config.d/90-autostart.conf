# --- Autostart ----------------------------------------------------------------
# exec runs once at login; exec_always also on every reload

# Bar: waybar, config in ~/.config/waybar
bar {
    swaybar_command waybar
}

# Notifications (top right), config in ~/.config/mako/config
exec mako
# Password prompts for GUI programs: GNOME's agent lives in gnome-shell
exec /usr/lib/mate-polkit/polkit-mate-authentication-agent-1 || \
     /usr/libexec/polkit-mate-authentication-agent-1

# Apps on fixed workspaces, enable when needed:
# exec swaymsg 'workspace number 2; exec brave'
# exec swaymsg 'workspace number 3; exec zed'
