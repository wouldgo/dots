# --- Look ---------------------------------------------------------------------

font pango:$font

# Thin borders, no title bars on tiled windows; floating windows keep a thin
# border too. Title bars still show in tabbed/stacked layouts.
default_border pixel 2
default_floating_border pixel 2
# No border when a workspace holds a single window
smart_borders on

gaps inner 6
gaps outer 0

# class                 border   background text     indicator child_border
client.focused          $yellow  $yellow    $bg0     $orange   $yellow
client.focused_inactive $bg3     $bg2       $fg      $bg3      $bg3
client.unfocused        $bg1     $bg1       $gray    $bg1      $bg1
client.urgent           $red     $red       $bg0     $red      $red

# Wallpaper: plain gruvbox background until there is an image
output * bg $bg0 solid_color
