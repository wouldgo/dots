# tmux config, rebuilt from scratch one step at a time.
# The previous version is in git: tmux/.tmux.conf

# --- Terminal and colors ------------------------------------------------------

# Programs inside tmux see a "tmux" terminal: correct italics, strikethrough, etc.
set -g default-terminal "tmux-256color"

# True color, undercurl and OSC52 clipboard only where the terminal actually
# supports them (not on the Linux console).
# -u before -a: reloading the config does not pile up duplicate entries
set -su terminal-features
set -sa terminal-features ",alacritty*:RGB:usstyle:clipboard"

# Programs (e.g. nvim) know when the pane gains/loses focus
set -g focus-events on
# Short wait after ESC: tells ESC apart from Alt+key without slowing down nvim
set -sg escape-time 10

# --- Basic behavior -----------------------------------------------------------

# Prefix C-a; C-a C-a sends a C-a to the program
set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g mouse on
set -g history-limit 90000
# tmux messages stay visible for 4 seconds
set -g display-time 4000
# Terminal window title updated by tmux
set -g set-titles on

# Windows and panes numbered from 1, no gaps when one is closed
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Reload the config
bind r source-file ~/.config/tmux/tmux.conf \; display-message 'tmux.conf reloaded'

# --- Pane navigation ----------------------------------------------------------

# No prefix-less shortcuts: Alt/Ctrl+arrows are left to the shell and programs.
# tmux defaults, restated for clarity (-r: repeatable within repeat-time, 500ms):
#   prefix + arrows       -> move focus
#   prefix + Ctrl+arrows  -> resize
bind -r Up    select-pane -U
bind -r Down  select-pane -D
bind -r Left  select-pane -L
bind -r Right select-pane -R

bind -r C-Up    resize-pane -U
bind -r C-Down  resize-pane -D
bind -r C-Left  resize-pane -L
bind -r C-Right resize-pane -R

# --- Splits and windows -------------------------------------------------------

# New splits and windows start in the current pane's directory
#   prefix + \  -> side by side
#   prefix + -  -> one above the other
bind '\' split-window -h -c "#{pane_current_path}"
bind -   split-window -v -c "#{pane_current_path}"
bind c   new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# --- Copy/paste ---------------------------------------------------------------

# Every copy also goes to the system clipboard via OSC52: tmux hands it to the
# terminal (Alacritty), no external programs needed. Paste with Ctrl+Shift+V.
set -s set-clipboard on

# vi-style copy mode: v selects, C-v rectangle, y copies
set -g mode-keys vi
bind -T copy-mode-vi v   send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle

# After copying: if the view is at the bottom, leave copy mode; if scrolled
# back, stay there (no jump to the bottom); then leave with q
bind -T copy-mode-vi y \
  send -X copy-selection \; \
  if -F '#{==:#{scroll_position},0}' { send -X cancel }
bind -T copy-mode-vi MouseDragEnd1Pane \
  send -X copy-selection \; \
  if -F '#{==:#{scroll_position},0}' { send -X cancel }
# Double click = word, triple click = line (the pause shows what was copied)
bind -T copy-mode-vi DoubleClick1Pane \
  select-pane \; send -X select-word \; run -d 0.3 \; send -X copy-selection \; \
  if -F '#{==:#{scroll_position},0}' { send -X cancel }
bind -T copy-mode-vi TripleClick1Pane \
  select-pane \; send -X select-line \; run -d 0.3 \; send -X copy-selection \; \
  if -F '#{==:#{scroll_position},0}' { send -X cancel }

# --- Status bar and theme (gruvbox dark) --------------------------------------
# 256-color palette: bg0 235, bg1 237, bg2 239, bg4 240/241, fg4 248, fg2 250,
# fg1 223, red 167, green 142, yellow 214, blue 109

set -g status-position bottom
set -g status-justify left
# Refresh every 5s, including the directory and command shown in windows
set -g status-interval 5

set -g status-style "bg=colour237,fg=colour223"
set -g message-style "bg=colour239,fg=colour223"
set -g message-command-style "bg=colour239,fg=colour223"
set -g pane-border-style "fg=colour237"
set -g pane-active-border-style "fg=colour250"
set -g display-panes-colour colour237
set -g display-panes-active-colour colour250
set -g clock-mode-colour colour109
# Copy mode selection: inverted colors
set -g mode-style "reverse"

# Windows:  1 │ zsh · dots   ("+" after the number = zoomed pane).
# Name = running command (automatic-rename), directory = last component of the
# active pane's path, "~" for home
set -g window-status-separator " :: "
set -g window-status-format \
  " #I#{?window_zoomed_flag,+, }│ #W · #{?#{==:#{pane_current_path},$HOME},~,#{b:pane_current_path}} "
set -g window-status-current-format "#{E:window-status-format}"
set -g window-status-style "fg=colour248"
set -g window-status-current-style "fg=colour231,bg=colour240,bold"
set -g window-status-bell-style "fg=colour235,bg=colour167"

# Right side holds only status indicators: PREFIX after C-a, COPY in copy mode
set -g status-left ""
set -g status-right-length 40
set -g status-right \
  "#{?client_prefix,#[fg=colour235#,bg=colour109#,bold] PREFIX #[default],}#{?#{==:#{pane_mode},copy-mode},#[fg=colour235#,bg=colour214#,bold] COPY #[default],}"
